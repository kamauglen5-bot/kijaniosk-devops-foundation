apiVersion: apps/v1
kind: Deployment
metadata:
  name: kk-payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kk-payments
  template:
    metadata:
      labels:
        app: kk-payments
    spec:
      containers:
      - name: kk-payments
        image: glenkamau/kk-payments:1.0.0-fcafbc4
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        env:
        - name: VERSION
          value: "1.0.0-fcafbc4"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
